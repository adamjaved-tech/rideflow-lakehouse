# UNVERIFIED in the build environment (no Docker daemon available). See README.
services:
  pipeline:            # file-based run: docker compose run --rm pipeline
    build: .
    environment:
      RIDEFLOW_LOG_LEVEL: INFO
    volumes:
      - ./data/lake:/app/data/lake
      - ./data/warehouse:/app/data/warehouse
      - ./reports:/app/reports

  kafka:               # docker compose --profile streaming up -d kafka
    profiles: ["streaming"]
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  pipeline-kafka:      # docker compose --profile streaming run --rm pipeline-kafka
    profiles: ["streaming"]
    build:
      context: .
      args:
        INSTALL_KAFKA: "true"
    depends_on: [kafka]
    environment:
      RIDEFLOW_SOURCE_TYPE: kafka
      RIDEFLOW_KAFKA_BOOTSTRAP: kafka:9092
    command: ["sh", "-c", "python scripts/kafka_produce.py data/sample/events.jsonl && python -m rideflow run"]
    volumes:
      - ./data/lake:/app/data/lake
      - ./data/warehouse:/app/data/warehouse
      - ./reports:/app/reports
